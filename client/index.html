<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved preference before the first paint; keep in sync with ThemeProvider.
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("aicoach.theme") || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <title>AICoach — Practice for your next interview</title>
    <meta
      name="description"
      content="Practice interviews, reflect on your answers, and track your progress with AICoach."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="AI Interview Coach" />
    <meta
      property="og:description"
      content="Master your interview skills with real-time AI feedback on speech and non-verbal cues."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="AI Interview Coach" />
    <meta
      name="twitter:description"
      content="Master your interview skills with real-time AI feedback on speech and non-verbal cues."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts: Space Grotesk (Headings), Inter (Body), JetBrains Mono (Code/Data) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
